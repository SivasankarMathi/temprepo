<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        <span class="error" id="email-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="8" />
        <span class="error" id="password-error" role="alert"></span>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember" /> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" id="submit-btn">Sign in</button>
      <span class="form-message" id="form-message" role="status"></span>
    </form>

    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
