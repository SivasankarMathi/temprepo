<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <h1 class="card-title">Welcome back</h1>
        <p class="card-subtitle">Sign in to your account</p>
      </div>

      <div id="alert-box" class="alert hidden" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <div id="email-error" class="field-error" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <div class="password-label-wrapper">
            <label for="password" class="form-label">Password</label>
            <a href="#forgot" id="forgot-link" class="link-small">Forgot password?</a>
          </div>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="password-toggle-btn"
              aria-label="Toggle password visibility"
            >
              <svg id="eye-icon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div id="password-error" class="field-error" aria-live="polite"></div>
        </div>

        <div class="form-row-checkbox">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="remember" class="form-checkbox" />
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
          <span>Sign In</span>
        </button>
      </form>

      <p class="card-footer-text">
        Don't have an account?
        <a href="#signup" class="text-link">Sign up</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
